trigger: 
  - feature-*

pool: 'somepool'

steps:  

- task: Bash@3
  displayName: 'Get slot name'
  inputs:
    targetType: 'inline'
    script: |
      branchName=$(Build.SourceBranchName)
      slotName="${branchName/feature-/f}" 
      echo "##vso[task.setvariable variable=SlotName]$slotName"


- task: AzureCLI@2
  displayName: 'Check if Slot Exists'
  inputs:
    azureSubscription: '<Your-Service-Connection. >' # TO DO Set UP Azure Resource Manager
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Check for slot existence
      SLOT_EXISTS=$(az webapp deployment slot list \
        --name "$(webAppName)" \
        --resource-group "$(resourceGroupName)" \
        --query "[?name=='$(SlotName)'].name" \
        --output tsv)

      if [ -z "$SLOT_EXISTS" ]; then
        echo "Slot $(SlotName) does not exist."
        az webapp deployment slot create \
          --name "$(webAppName)" \
          --resource-group "$(resourceGroupName)" \
          --slot "$(SlotName)"
        echo "Slot $(SlotName) has been created"
      else
        echo "Slot $(SlotName) exists."
      fi

- task: NuGetCommand@2
  displayName: 'NuGet restore'
  inputs:
    vstsFeed: 'c673934b-06e3-49af-91f7-ea12bf4a126c'

- task: VSBuild@1
  displayName: 'Build CallCenterWebAPI (debug.publish)'
  inputs:
    solution: '**\CallCenterWebAPI.sln'
    msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactstagingdirectory)\\Web\\Debug\\"'
    platform: '$(BuildPlatform)'
    configuration: debug.publish

- task: AzureCLI@2
  displayName: 'Check if Slot Exists'
  inputs:
    azureSubscription: '<Your-Service-Connection. >' # TO DO Set UP Azure Resource Manager
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az webapp deploy \
          --name "$(webAppName)" \
          --resource-group "$(resourceGroupName)" \
          --slot "$(SlotName)"
          --src-path $(build.artifactstagingdirectory)\Web\Debug\CallCenterWebAPI.zip \
          --type zip
